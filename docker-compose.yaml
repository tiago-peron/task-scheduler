services:
  postgres:
    image: postgres:17-alpine
    container_name: user-service-db
    environment:
      POSTGRES_DB: ${DB_DATABASE_USER}
      POSTGRES_USER: ${DB_USERNAME_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_USER}
    ports:
      - "127.0.0.1:${DB_PORT_USER}:5432"
    networks:
      - user-service-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: user-service-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD_USER}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD_USER}"]
    ports:
      - "127.0.0.1:${REDIS_PORT_USER}:6379"
    networks:
      - user-service-network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  user-service-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_USER}
      POSTGRES_USER: ${POSTGRES_USERNAME_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_USER}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_USER}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: scheduler-service-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME_SCHEDULER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD_SCHEDULER}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE_SCHEDULER}
    ports:
      - "127.0.0.1:${MONGO_PORT_SCHEDULER}:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: user-service-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD_USER}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD_USER}"]
    ports:
      - "127.0.0.1:${REDIS_PORT_USER}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

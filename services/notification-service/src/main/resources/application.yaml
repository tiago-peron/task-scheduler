spring:
  application:
    name: notification-service
  config:
    import: optional:file:.env[.properties]
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${API_PORT_NOTIFICATION:8080}

send:
  email:
    sender:
    sendername: 'Tiago Peron'

thymeleaf:
  enable: true

spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT_USER}/${DB_DATABASE_USER}
    username: ${DB_USERNAME_USER}
    password: ${DB_PASSWORD_USER}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false

server:
  port: ${API_PORT_USER:8080}

external-services:
  viacep:
    url: ${VIA_CEP_URL:https://viacep.com.br}

redis:
  hostname: ${REDIS_HOST}
  port: ${REDIS_PORT_USER}
  password: ${REDIS_PASSWORD_USER}

secret:
  key: ${SECRET_KEY}
